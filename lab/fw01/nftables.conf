#!/usr/sbin/nft -f
# FW01 · /etc/nftables.conf
#
# Traduce la matriz de tráfico de 00-diseno/02-topologia.md a reglas.
# Placas: wan, srv, cli, seg, ais (ver interfaces y systemd/*.link).
#
# No uso "flush ruleset": borraría las tablas que crea Tailscale.
# En su lugar borro y recreo solo mis tablas.

table inet lab
delete table inet lab
table ip lab_nat
delete table ip lab_nat

table inet lab {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept

		# Ping al gateway desde los segmentos internos (Aislada no)
		iifname { "srv", "cli", "seg" } icmp type echo-request accept

		# Administración de FW01: solo por Tailscale
		iifname "tailscale0" tcp dport 22 accept
		iifname "tailscale0" icmp type echo-request accept

		# Tailscale: conexiones directas entrantes
		iifname "wan" udp dport 41641 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		# Matriz de tráfico
		# Clientes -> Internet y Servidores
		iifname "cli" oifname { "wan", "srv" } accept
		# Seguridad -> todos
		iifname "seg" oifname { "wan", "srv", "cli", "ais" } accept
		# Servidores y Aislada no inician conexiones: lo resuelve el policy drop

		# Administración desde Tailscale (subnet router): SSH y RDP, nunca hacia Aislada
		iifname "tailscale0" oifname { "srv", "cli" } tcp dport { 22, 3389 } accept
		iifname "tailscale0" oifname { "srv", "cli" } icmp type echo-request accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip lab_nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		# Todo lo que sale a internet sale con la IP de FW01 (10.10.0.2).
		# El NAT del host solo traduce 10.10.0.0/24.
		oifname "wan" masquerade
	}
}
